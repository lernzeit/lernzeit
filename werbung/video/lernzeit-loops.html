<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LernZeit Loops</title>
<style>
@font-face { font-family: 'Inter'; src: url('inter-latin-wght.woff2') format('woff2'); font-weight: 100 900; }
:root {
  --blau: #3B82F6; --blau-hell: #66A3FF; --gruen: #13C96A; --gruen-dunkel: #0E9F55;
  --amber: #F59E0B; --text: #0F172A; --leise: #64748B; --grund: #F7F9FF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--grund); font-family: 'Inter', system-ui, sans-serif; color: var(--text); }
#buehne { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; will-change: transform, opacity; }
.blob { border-radius: 50%; filter: blur(90px); opacity: .55; }

/* Schlagzeile oben */
#zeile { left: 0; right: 0; top: 150px; height: 300px; }
.satz { position: absolute; left: 90px; right: 90px; top: 0; font-size: 84px; font-weight: 800; letter-spacing: -2.5px; line-height: 1.04; }
.wort { display: inline-block; will-change: transform, opacity; margin-right: .22em; }
.blau { color: var(--blau); } .gruen { color: var(--gruen-dunkel); }

/* Handy */
.handy { left: 0; top: 0; width: 560px; height: 1090px; border-radius: 86px; background: #0B1220; padding: 18px; box-shadow: 0 60px 120px -40px rgba(15, 23, 42, .45), 0 0 0 2px rgba(255,255,255,.06) inset; }
.schirm { position: relative; width: 100%; height: 100%; border-radius: 70px; overflow: hidden; background: #fff; }
.insel { position: absolute; top: 22px; left: 50%; width: 150px; height: 40px; margin-left: -75px; border-radius: 22px; background: #0B1220; z-index: 5; }

/* Sperrbildschirm */
#sperre { inset: 0; background: linear-gradient(160deg, #1E293B, #0F172A); color: #fff; display: flex; flex-direction: column; align-items: center; }
#sperre .uhr { margin-top: 170px; font-size: 150px; font-weight: 300; letter-spacing: -4px; }
#sperre .datum { font-size: 30px; opacity: .7; margin-top: 4px; }
#schloss { margin-top: 210px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; }

/* App */
#app { inset: 0; background: #fff; }
.app-kopf { position: absolute; left: 0; right: 0; top: 0; height: 330px; background: linear-gradient(160deg, var(--blau), #2563EB 70%); }
#ring { left: 50%; top: 92px; width: 210px; height: 210px; margin-left: -105px; }
#ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
#ringtext { left: 0; right: 0; top: 160px; text-align: center; color: #fff; font-size: 46px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
#ringlabel { left: 0; right: 0; top: 214px; text-align: center; color: rgba(255,255,255,.85); font-size: 20px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
#karte { left: 40px; right: 40px; top: 380px; height: 300px; border-radius: 40px; background: #F1F5FF; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#karte .fach { font-size: 24px; font-weight: 700; color: var(--blau); letter-spacing: 2px; text-transform: uppercase; }
#aufgabe { font-size: 120px; font-weight: 800; letter-spacing: -3px; margin-top: 6px; font-variant-numeric: tabular-nums; }
#antworten { left: 40px; right: 40px; top: 720px; display: flex; gap: 22px; }
.knopf { flex: 1; height: 150px; border-radius: 34px; background: #fff; border: 4px solid #E2E8F0; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: var(--text); position: relative; overflow: hidden; }
.welle { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: rgba(19, 201, 106, .35); left: 50%; top: 50%; margin: -20px 0 0 -20px; }
#finger { width: 96px; height: 96px; border-radius: 50%; background: rgba(15, 23, 42, .18); border: 5px solid rgba(255,255,255,.9); box-shadow: 0 8px 20px rgba(15,23,42,.2); }

/* Muenzen */
.muenze { left: 0; top: 0; height: 84px; padding: 0 30px; border-radius: 42px; background: linear-gradient(180deg, #FBBF24, var(--amber)); color: #fff; font-size: 38px; font-weight: 800; display: flex; align-items: center; white-space: nowrap; box-shadow: 0 14px 30px -10px rgba(245, 158, 11, .7); letter-spacing: -.5px; }

/* Eltern-Handy */
#eltern-schirm { inset: 0; background: linear-gradient(180deg, #F8FAFC, #EEF2FF); }
#eltern-kopf { left: 50px; top: 120px; font-size: 30px; font-weight: 700; color: var(--leise); }
#eltern-titel { left: 50px; top: 160px; font-size: 54px; font-weight: 800; letter-spacing: -1.5px; }
#anfrage { left: 30px; right: 30px; top: 330px; border-radius: 40px; background: #fff; padding: 40px; box-shadow: 0 30px 60px -30px rgba(15,23,42,.35); }
#anfrage .wer { display: flex; align-items: center; gap: 22px; }
#anfrage .avatar { width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(135deg, #A78BFA, var(--blau)); color: #fff; font-size: 44px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
#anfrage .name { font-size: 40px; font-weight: 800; }
#anfrage .was { font-size: 30px; color: var(--leise); margin-top: 4px; }
#anfrage .minuten { margin-top: 34px; font-size: 96px; font-weight: 800; letter-spacing: -3px; color: var(--blau); }
#anfrage .minuten small { font-size: 40px; color: var(--leise); font-weight: 700; letter-spacing: 0; margin-left: 8px; }
#anfrage .knoepfe { display: flex; gap: 20px; margin-top: 34px; }
#anfrage .k { flex: 1; height: 110px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 31px; font-weight: 800; }
#k-nein { background: #F1F5F9; color: var(--leise); }
#k-ja { background: var(--gruen); color: #fff; position: relative; overflow: hidden; }
#haken-gross { left: 50%; top: 820px; width: 200px; height: 200px; margin-left: -100px; border-radius: 50%; background: var(--gruen); display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 60px -20px rgba(19,201,106,.7); }
.funke { width: 18px; height: 18px; border-radius: 50%; }

/* Abschluss */
#logo { left: 50%; top: 610px; width: 260px; height: 260px; margin-left: -130px; border-radius: 68px; background: linear-gradient(135deg, var(--blau), var(--gruen)); display: flex; align-items: center; justify-content: center; box-shadow: 0 50px 90px -30px rgba(59,130,246,.65); }
#wortmarke { left: 0; right: 0; top: 920px; text-align: center; font-size: 132px; font-weight: 800; letter-spacing: -5px; }
#claim { left: 0; right: 0; top: 1090px; text-align: center; font-size: 52px; font-weight: 700; letter-spacing: -1px; }
#pille { left: 50%; top: 1240px; transform: translateX(-50%); height: 112px; padding: 0 56px; border-radius: 56px; background: var(--text); color: #fff; display: flex; align-items: center; font-size: 42px; font-weight: 700; white-space: nowrap; }
</style>
<style>
/* Loops fuer die Landingpage: ohne Schlagzeilen, Hintergrund ruhig */
#buehne { background: var(--grund); }
</style>
</head>
<body>
<div id="buehne">
  <div class="abs blob" id="blob1" style="width:900px;height:900px;background:#BFDBFE;"></div>
  <div class="abs blob" id="blob2" style="width:800px;height:800px;background:#BBF7D0;"></div>
  <!-- Kind-Handy -->
  <div class="abs handy" id="handy-kind">
    <div class="schirm">
      <div class="insel"></div>
      <div class="abs" id="app">
        <div class="app-kopf"></div>
        <div class="abs" id="ring">
          <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"/><circle id="ringbogen" cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="276.46"/></svg>
        </div>
        <div class="abs" id="ringtext">0:00</div>
        <div class="abs" id="ringlabel">verdient</div>
        <div class="abs" id="karte"><div class="fach" id="fach">Mathe · Klasse 3</div><div id="aufgabe">7 × 8</div></div>
        <div class="abs" id="antworten">
          <div class="knopf" id="a0"><span>54</span></div>
          <div class="knopf" id="a1"><span>56</span><div class="welle" id="welle"></div></div>
          <div class="knopf" id="a2"><span>63</span></div>
        </div>
      </div>
      <div class="abs" id="sperre">
        <div class="uhr">18:00</div>
        <div class="datum">Dienstag, 6. Oktober</div>
        <div id="schloss"><svg width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      </div>
      <div class="abs" id="finger"></div>
    </div>
  </div>

  <!-- Eltern-Handy -->
  <div class="abs handy" id="handy-eltern">
    <div class="schirm">
      <div class="insel"></div>
      <div class="abs" id="eltern-schirm">
        <div class="abs" id="eltern-kopf">LernZeit · Eltern</div>
        <div class="abs" id="eltern-titel">Neue Anfrage</div>
        <div class="abs" id="anfrage">
          <div class="wer"><div class="avatar">M</div><div><div class="name">Mia</div><div class="was">möchte Handyzeit einlösen</div></div></div>
          <div class="minuten">5<small>Minuten</small></div>
          <div class="knoepfe"><div class="k" id="k-nein">Ablehnen</div><div class="k" id="k-ja">Freigeben</div></div>
        </div>
        <div class="abs" id="haken-gross"><svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path id="hakenpfad" d="M5 12.5l4.5 4.5L19 7.5" stroke-dasharray="24" stroke-dashoffset="24"/></svg></div>
      </div>
      <div class="abs" id="finger2" style="width:96px;height:96px;border-radius:50%;background:rgba(15,23,42,.18);border:5px solid rgba(255,255,255,.9);"></div>
    </div>
  </div>

  <div id="muenzen"></div>
  <div id="funken"></div>
</div>
<script src="loops.js"></script>
</body>
</html>
